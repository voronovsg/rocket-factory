services:
  postgres-iam:
    image: postgres:18-alpine3.23
    container_name: postgres-iam
    env_file:
      - .env
    volumes:
      - postgres_iam_data:/var/lib/postgresql
    ports:
      - "${EXTERNAL_POSTGRES_PORT}:5432" # порт хоста: порт контейнера
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - microservices-net

  redis-iam:
    image: redis:8.8.0-alpine3.23
    container_name: redis-iam
    env_file:
      - .env
    ports:
      - "${EXTERNAL_REDIS_PORT}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - microservices-net

volumes:
  postgres_iam_data:

networks:
  microservices-net:
    external: true # Подключаемся к существующей сети
