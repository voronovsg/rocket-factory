apiVersion: 1

# Секция providers описывает источники дашбордов
providers:
  # Провайдер - это источник дашбордов, который Grafana будет использовать для загрузки
  # <string> Уникальное имя провайдера, используется для идентификации в логах и отладке
  - name: 'Microservices Dashboard'
    
    # <int> ID организации в Grafana, к которой будут принадлежать загруженные дашборды
    # По умолчанию используется orgId 1, если не указано иное
    orgId: 1
    
    # <string, required> Имя папки в Grafana, в которой будут размещены дашборды
    # Пустое значение означает корневой уровень (без папки)
    folder: ''
    
    # <string> Уникальный идентификатор папки
    # Если не указан, будет сгенерирован автоматически
    folderUid: ''
    
    # <string, required> Тип провайдера, обязательный параметр
    # 'file' означает, что дашборды загружаются из файловой системы
    type: file
    
    # <bool> Запрет на удаление дашбордов через интерфейс Grafana
    # false - разрешает удаление, true - запрещает
    disableDeletion: false
    
    # <bool> Разрешение на редактирование загруженных дашбордов через интерфейс
    # true - можно редактировать, false - только просматривать
    editable: true
    
    # <int> Частота сканирования изменений в файлах дашбордов (в секундах)
    # Grafana будет проверять изменения каждые 10 секунд
    updateIntervalSeconds: 10
    
    # <bool> Разрешение на обновление провиженных дашбордов через веб-интерфейс
    # true - изменения из UI будут сохраняться, false - только из файлов
    allowUiUpdates: true
    
    # Дополнительные опции провайдера
    options:
      # <string, required> Путь к файлам дашбордов на диске, обязательный параметр
      # В контейнере этот путь смонтирован к директории с JSON-файлами дашбордов
      path: /var/lib/grafana/dashboards 