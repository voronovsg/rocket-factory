receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 16
        read_buffer_size: 128_000
        keepalive:
          server_parameters:
            time: 30s
            timeout: 5
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins: [ "*" ]
          allowed_headers: [ "*" ]

processors:
  batch:
    send_batch_size: 1000
    timeout: 10s
    send_batch_max_size: 1000
  probabilistic_sampler:
    sampling_percentage: 100
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 15
  resource_detection:
    detectors: [ env, system ]
    timeout: 5s

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  debug:
    verbosity: detailed
  elasticsearch:
    endpoints: [ "http://elasticsearch:9200" ]
    timeout: 5s
    mapping:
      mode: "ecs"
    tls:
      insecure: true
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    tls:
      insecure: true
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s


service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, probabilistic_sampler, batch, resource_detection]
      exporters: [otlp/jaeger, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource_detection]
      exporters: [elasticsearch, debug]
    metrics:
      receivers: [ otlp ]
      processors: [ memory_limiter, batch, resource_detection ]
      exporters: [ prometheusremotewrite, debug ]
